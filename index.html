<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#00a884" />
  <title>Family WhatsApp</title>

  <!-- Open-source PeerJS for WebRTC Direct P2P -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --wa-teal: #00a884;
      --wa-teal-dark: #008069;
      --wa-bg: #efeae2;
      --wa-panel-bg: #ffffff;
      --wa-msg-out: #d9fdd3;
      --wa-msg-in: #ffffff;
      --wa-text-primary: #111b21;
      --wa-text-secondary: #667781;
      --wa-border: #e9edef;
      --wa-header: #f0f2f5;
      --wa-blue-tick: #53bdeb;
      --wa-grey-tick: #8696a0;
      --wa-online: #22c55e;
      --wa-danger: #ea0038;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #111b21;
      position: fixed;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--wa-text-primary);
    }

    .app-wrapper {
      width: 100vw;
      height: 100dvh;
      display: flex;
      background: var(--wa-panel-bg);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 900px) {
      .app-wrapper {
        max-width: 1300px;
        height: 96dvh;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
    }

    /* Modal dialogs */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 20, 26, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }

    .modal-card {
      background: white;
      padding: 26px 22px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.3);
      text-align: center;
    }

    .modal-card h2 {
      color: var(--wa-teal-dark);
      font-size: 22px;
      margin-bottom: 6px;
    }

    .modal-card p {
      font-size: 13px;
      color: var(--wa-text-secondary);
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--wa-text-secondary);
      text-transform: uppercase;
    }

    .app-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--wa-border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }

    .app-input:focus {
      border-color: var(--wa-teal);
      background: white;
    }

    .app-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: var(--wa-teal);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .app-btn:hover {
      background: var(--wa-teal-dark);
    }

    .app-btn.secondary {
      background: #f0f2f5;
      color: var(--wa-text-primary);
      margin-top: 10px;
      border: 1px solid var(--wa-border);
    }

    .error-msg {
      color: var(--wa-danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--wa-border);
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 380px;
      }
    }

    .sidebar-header {
      height: 64px;
      background: var(--wa-header);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--wa-border);
    }

    .search-box {
      padding: 8px 14px;
      background: #fff;
      border-bottom: 1px solid var(--wa-border);
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      background: #f0f2f5;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--wa-teal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      position: relative;
      flex-shrink: 0;
    }

    .avatar.online::after {
      content: '';
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--wa-online);
      border: 2px solid white;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f6f7f8;
    }

    .contact-item:hover, .contact-item.active {
      background: #f0f2f5;
    }

    .contact-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .contact-title {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
    }

    .contact-status {
      font-size: 13px;
      color: var(--wa-text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-status.online-text {
      color: var(--wa-teal-dark);
      font-weight: 500;
    }

    /* Main Chat Interface */
    .chat-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--wa-bg);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    @media (min-width: 768px) {
      .chat-view {
        position: relative;
        transform: none;
        flex: 1;
        z-index: 1;
      }
    }

    .chat-view.active {
      transform: translateX(0);
    }

    .chat-header {
      height: 64px;
      background: var(--wa-header);
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--wa-border);
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--wa-text-secondary);
      padding: 6px;
    }

    @media (min-width: 768px) {
      .back-btn {
        display: none;
      }
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-image: radial-gradient(#d1d7db 10%, transparent 11%);
      background-size: 16px 16px;
    }

    .message {
      max-width: 82%;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 1.5px rgba(0,0,0,0.14);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @media (min-width: 768px) {
      .message {
        max-width: 62%;
      }
    }

    .message.sent {
      align-self: flex-end;
      background: var(--wa-msg-out);
      border-top-right-radius: 0;
    }

    .message.received {
      align-self: flex-start;
      background: var(--wa-msg-in);
      border-top-left-radius: 0;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 11px;
      color: var(--wa-text-secondary);
      align-self: flex-end;
    }

    /* WhatsApp Tick Icons */
    .tick {
      font-size: 13px;
      letter-spacing: -2.5px;
      margin-left: 2px;
    }
    .tick.queued { color: var(--wa-grey-tick); }
    .tick.sent { color: var(--wa-grey-tick); }
    .tick.delivered { color: var(--wa-grey-tick); font-weight: bold; }
    .tick.read { color: var(--wa-blue-tick); font-weight: bold; }

    /* Progress Bars for Media/Documents */
    .progress-box {
      margin: 6px 0;
      padding: 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--wa-teal);
      width: 0%;
      transition: width 0.15s ease-out;
    }

    .progress-label {
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      color: var(--wa-text-secondary);
    }

    .chat-footer {
      min-height: 60px;
      background: var(--wa-header);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    .chat-input {
      flex: 1;
      background: white;
      border-radius: 20px;
      border: 1px solid white;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
    }

    .icon-btn, .send-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: var(--wa-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
    }

    .send-btn {
      background: var(--wa-teal);
      color: white;
      font-size: 17px;
    }

    .media-thumb-box {
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      background: rgba(0,0,0,0.05);
      margin-top: 2px;
    }

    .media-thumb-box img, .media-thumb-box video {
      max-width: 100%;
      max-height: 260px;
      display: block;
      object-fit: cover;
    }

    .doc-bubble {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: rgba(0,0,0,0.04);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    /* Incoming Call Ringing Screen */
    #incomingCallModal {
      position: fixed;
      inset: 0;
      background: rgba(11, 20, 26, 0.95);
      z-index: 18000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .ring-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--wa-teal);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: bold;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); }
      70% { box-shadow: 0 0 0 26px rgba(0, 168, 132, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0); }
    }

    .call-decision-btns {
      display: flex;
      gap: 40px;
      margin-top: 25px;
    }

    .call-action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
    }

    .call-action-btn.accept { background: var(--wa-online); }
    .call-action-btn.decline { background: var(--wa-danger); }

    /* Active Call Overlay */
    .call-overlay {
      position: fixed;
      inset: 0;
      background: #111b21;
      z-index: 16000;
      display: none;
      flex-direction: column;
    }

    .call-streams {
      flex: 1;
      position: relative;
    }

    video#remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video#localVideo {
      position: absolute;
      bottom: 20px;
      right: 16px;
      width: 110px;
      height: 155px;
      border-radius: 10px;
      object-fit: cover;
      background: #202c33;
      border: 2px solid white;
    }

    .call-controls {
      height: 84px;
      background: #202c33;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .call-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: white;
      background: #374248;
    }

    .call-btn.end {
      background: var(--wa-danger);
    }

    #attachmentMenu {
      display: none;
      position: absolute;
      bottom: 65px;
      left: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      padding: 6px;
      flex-direction: column;
      z-index: 100;
    }

    .attach-item {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .attach-item:hover {
      background: #f0f2f5;
    }

    #mediaLightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 15000;
      display: none;
      flex-direction: column;
    }

    .lightbox-bar {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .lightbox-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .lightbox-body img, .lightbox-body video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-body iframe {
      width: 100%;
      height: 100%;
      background: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- 1. Authentication Modal (Register First / Login) -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="authTitle">Register Profile</h2>
      <p id="authSubtitle">Join the family directory to begin chatting</p>
      
      <div id="authError" class="error-msg"></div>

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="authNameInput" class="app-input" placeholder="e.g. John, Sarah" />
      </div>

      <div class="form-group">
        <label>6-Digit PIN</label>
        <input type="password" maxlength="6" id="authPinInput" class="app-input" inputmode="numeric" placeholder="••••••" style="letter-spacing: 4px;" />
      </div>

      <button class="app-btn" id="authSubmitBtn" onclick="handleAuthSubmit()">Create Profile & Register</button>
      <button class="app-btn secondary" id="authToggleBtn" onclick="toggleAuthMode()">Already registered? Login</button>
    </div>
  </div>

  <!-- Sidebar: Contacts Directory & Realtime Search -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="avatar" id="myProfileAvatar">?</div>
        <div>
          <strong id="myProfileName">Me</strong>
          <div style="font-size: 11px; color: var(--wa-teal-dark);">● Connected</div>
        </div>
      </div>
      <button class="icon-btn" onclick="logout()" title="Switch Account">🔄</button>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search family members..." oninput="handleSearch(this.value)" />
    </div>

    <!-- Contact List -->
    <div id="contactList" style="overflow-y:auto; flex:1;"></div>
  </aside>

  <!-- Main Active Conversation -->
  <main class="chat-view" id="chatView">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">←</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div style="flex:1; overflow:hidden;">
        <h4 id="chatTitle">Member</h4>
        <small id="chatPeerStatus" style="font-size: 11px; color: var(--wa-text-secondary);">Direct WebRTC P2P</small>
      </div>
      <div style="display:flex; gap:2px;">
        <button class="icon-btn" onclick="triggerCall(false)" title="Voice Call">📞</button>
        <button class="icon-btn" onclick="triggerCall(true)" title="Video Call">📹</button>
      </div>
    </div>

    <!-- Message Scroller -->
    <div class="chat-messages" id="messagesContainer"></div>

    <!-- Attachment Popup -->
    <div id="attachmentMenu">
      <label class="attach-item">
        📷 Photos & Videos
        <input type="file" accept="image/*,video/*,audio/*" style="display: none;" onchange="dispatchFile(event)">
      </label>
      <label class="attach-item">
        📄 Documents & Files
        <input type="file" style="display: none;" onchange="dispatchFile(event)">
      </label>
    </div>

    <!-- Footer Controls -->
    <footer class="chat-footer">
      <button class="icon-btn" onclick="toggleAttachmentMenu()">📎</button>
      <input type="text" id="chatInput" class="chat-input" placeholder="Type a message" onkeydown="if(event.key==='Enter') sendText()">
      <button class="send-btn" onclick="sendText()">➤</button>
    </footer>
  </main>
</div>

<!-- Incoming Call Ringing Screen -->
<div id="incomingCallModal">
  <div class="ring-avatar" id="ringAvatar">?</div>
  <h2 id="ringCallerName" style="color: white; font-size: 24px;">Family Member</h2>
  <p id="ringCallType" style="color: #8696a0;">Incoming Video Call...</p>
  
  <div class="call-decision-btns">
    <button class="call-action-btn decline" onclick="rejectIncomingCall()">✕</button>
    <button class="call-action-btn accept" onclick="acceptIncomingCall()">✓</button>
  </div>
</div>

<!-- Active Video/Voice Calling Screen -->
<div class="call-overlay" id="callOverlay">
  <div class="call-streams">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>
  <div class="call-controls">
    <button class="call-btn" id="muteMicBtn" onclick="toggleAudio()">🎤</button>
    <button class="call-btn" id="muteCamBtn" onclick="toggleVideo()">📹</button>
    <button class="call-btn end" onclick="terminateCall()">☎</button>
  </div>
</div>

<!-- Lightbox Modal -->
<div id="mediaLightbox">
  <div class="lightbox-bar">
    <span id="lightboxTitle" style="max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Preview</span>
    <div style="display:flex; gap:10px;">
      <button class="icon-btn" style="color:white;" id="lightboxDownloadBtn">⬇️</button>
      <button class="icon-btn" style="color:white;" onclick="closeLightbox()">✕</button>
    </div>
  </div>
  <div class="lightbox-body" id="lightboxBody"></div>
</div>

<script>
  /* ==========================================================
     1. CONFIGURATION & STATE
  ========================================================== */
  const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz1zqVJviRo9zQIWzEAFmLFRMbyzHVGjyu-s09TBhFnFCjhiFFKx0RdmWUqtTFbAEajlg/exec";
  const CHUNK_SIZE = 16384; // 16KB WebRTC chunks for smooth transfer

  let family = {};
  let currentUserId = null;
  let activeRecipientKey = null;
  let isRegisterMode = true; // First time opens in register mode
  let peer = null;
  let activeConnections = {};
  let onlinePeers = new Set();
  let db = null;

  // Cached Stream to prevent re-asking permissions
  let persistentLocalStream = null;
  let activeCallSession = null;
  let incomingCallObject = null;
  let ringtoneOscillator = null;
  let audioContext = null;

  // File chunk assembly store
  let incomingTransfers = {};

  /* ==========================================================
     2. PERSISTENT PERMISSION & RINGTONE SYNTHESIZER
  ========================================================== */
  async function requestPersistentMediaPermissions() {
    if (persistentLocalStream) return persistentLocalStream;
    try {
      persistentLocalStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      // Pause tracks until a call begins so camera indicator light goes off
      persistentLocalStream.getVideoTracks().forEach(t => t.enabled = false);
      persistentLocalStream.getAudioTracks().forEach(t => t.enabled = false);
      return persistentLocalStream;
    } catch (e) {
      console.warn("Media permissions deferred until first call:", e);
      return null;
    }
  }

  function startRingingSound() {
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, audioContext.currentTime);
      gain.gain.setValueAtTime(0.2, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      ringtoneOscillator = { osc, gain };
    } catch (e) {}
  }

  function stopRingingSound() {
    if (ringtoneOscillator) {
      try {
        ringtoneOscillator.osc.stop();
        ringtoneOscillator.osc.disconnect();
      } catch (e) {}
      ringtoneOscillator = null;
    }
  }

  /* ==========================================================
     3. DEVICE INDEXED-DB STORE (Permanent Local Storage)
  ========================================================== */
  function initLocalDB() {
    return new Promise((res) => {
      const r = indexedDB.open("WhatsAppFamilyP2P_v5", 1);
      r.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("messages")) {
          const store = d.createObjectStore("messages", { keyPath: "id" });
          store.createIndex("chatWith", "chatWith", { unique: false });
        }
      };
      r.onsuccess = (e) => {
        db = e.target.result;
        res();
      };
    });
  }

  function saveMessageLocally(obj) {
    if (!db) return;
    const tx = db.transaction("messages", "readwrite");
    tx.objectStore("messages").put(obj);
  }

  function updateMessageStatusLocally(msgId, status) {
    if (!db) return;
    const tx = db.transaction("messages", "readwrite");
    const store = tx.objectStore("messages");
    const req = store.get(msgId);
    req.onsuccess = () => {
      if (req.result) {
        req.result.status = status;
        store.put(req.result);
      }
    };
  }

  function loadChatHistory(contactKey) {
    if (!db) return;
    const box = document.getElementById("messagesContainer");
    box.innerHTML = "";
    const tx = db.transaction("messages", "readonly");
    tx.objectStore("messages").index("chatWith").getAll(contactKey).onsuccess = (e) => {
      (e.target.result || []).forEach(m => {
        if (m.type === "chat") {
          renderChatBubble(m, m.direction, m.status, false);
        } else {
          renderMediaBubble(m, m.direction, m.status, false);
        }
      });
      box.scrollTop = box.scrollHeight;
    };
  }

  /* ==========================================================
     4. GOOGLE SHEETS REGISTRATION & LOGIN
  ========================================================== */
  async function syncMembersFromGoogleSheet() {
    const cached = localStorage.getItem("wa_cached_family");
    if (cached) {
      try { family = JSON.parse(cached); } catch (e) {}
    }
    if (!GOOGLE_SHEET_API_URL || GOOGLE_SHEET_API_URL.includes("YOUR_DEPLOYED_GOOGLE_SCRIPT")) {
      return;
    }
    try {
      const resp = await fetch(`${GOOGLE_SHEET_API_URL}?action=getUsers`);
      const data = await resp.json();
      if (data.status === "success" && data.users) {
        family = data.users;
        localStorage.setItem("wa_cached_family", JSON.stringify(family));
      }
    } catch (err) {
      console.warn("Could not sync from Google Sheet, running on local cache.");
    }
  }

  async function registerUserToGoogleSheet(name, pin, peerId) {
    if (!GOOGLE_SHEET_API_URL || GOOGLE_SHEET_API_URL.includes("YOUR_DEPLOYED_GOOGLE_SCRIPT")) {
      return true; // Bypass if URL not yet configured
    }
    try {
      await fetch(GOOGLE_SHEET_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "register", name, pin, peerId })
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    const title = document.getElementById("authTitle");
    const sub = document.getElementById("authSubtitle");
    const submitBtn = document.getElementById("authSubmitBtn");
    const toggleBtn = document.getElementById("authToggleBtn");
    document.getElementById("authError").style.display = "none";

    if (isRegisterMode) {
      title.textContent = "Register Profile";
      sub.textContent = "Join the family directory to begin chatting";
      submitBtn.textContent = "Create Profile & Register";
      toggleBtn.textContent = "Already registered? Login";
    } else {
      title.textContent = "Family Login";
      sub.textContent = "Enter your registered name and 6-digit PIN";
      submitBtn.textContent = "Login";
      toggleBtn.textContent = "Need to register? Join here";
    }
  }

  async function handleAuthSubmit() {
    const name = document.getElementById("authNameInput").value.trim();
    const pin = document.getElementById("authPinInput").value.trim();
    const err = document.getElementById("authError");

    if (!name || pin.length !== 6 || isNaN(pin)) {
      err.textContent = "Enter a valid Name and a 6-digit numeric PIN.";
      err.style.display = "block";
      return;
    }

    const key = name.toLowerCase().replace(/\s+/g, "");

    if (isRegisterMode) {
      if (family[key]) {
        err.textContent = "This member name is already registered. Please log in.";
        err.style.display = "block";
        return;
      }
      const newPeerId = `wa-p2p-${key}-${Date.now().toString(36)}`;
      family[key] = { name, pin, id: newPeerId };
      localStorage.setItem("wa_cached_family", JSON.stringify(family));
      await registerUserToGoogleSheet(name, pin, newPeerId);
      completeLogin(key);
    } else {
      const matchKey = Object.keys(family).find(k => k === key || family[k].name.toLowerCase() === name.toLowerCase());
      if (matchKey && String(family[matchKey].pin) === String(pin)) {
        completeLogin(matchKey);
      } else {
        err.textContent = "Incorrect name or PIN. Make sure you have registered first.";
        err.style.display = "block";
      }
    }
  }

  async function completeLogin(userKey) {
    currentUserId = userKey;
    localStorage.setItem("wa_active_user", userKey);
    document.getElementById("authModal").style.display = "none";
    document.getElementById("myProfileName").textContent = family[userKey].name;
    document.getElementById("myProfileAvatar").textContent = family[userKey].name[0];

    await requestPersistentMediaPermissions();
    renderContacts();
    initWebRTC();
  }

  function logout() {
    localStorage.removeItem("wa_active_user");
    location.reload();
  }

  /* ==========================================================
     5. CONTACT DIRECTORY & REAL-TIME SEARCH
  ========================================================== */
  function renderContacts(query = "") {
    const container = document.getElementById("contactList");
    container.innerHTML = "";

    const filtered = Object.keys(family)
      .filter(k => k !== currentUserId)
      .filter(k => family[k].name.toLowerCase().includes(query.toLowerCase()))
      .sort((a, b) => (onlinePeers.has(b) ? 1 : 0) - (onlinePeers.has(a) ? 1 : 0));

    if (filtered.length === 0) {
      container.innerHTML = `<div style="text-align: center; color: var(--wa-text-secondary); padding: 24px; font-size: 13px;">No registered members found.</div>`;
      return;
    }

    filtered.forEach(key => {
      const c = family[key];
      const isOnline = onlinePeers.has(key);
      const div = document.createElement("div");
      div.className = `contact-item ${activeRecipientKey === key ? "active" : ""}`;
      div.onclick = () => openChat(key);
      div.innerHTML = `
        <div class="avatar ${isOnline ? "online" : ""}">${c.name[0]}</div>
        <div class="contact-details">
          <div class="contact-title"><span>${c.name}</span></div>
          <div class="contact-status ${isOnline ? "online-text" : ""}">
            ${isOnline ? "online" : "tap to chat"}
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function handleSearch(q) {
    renderContacts(q);
  }

  /* ==========================================================
     6. WEBRTC CONNECTIVITY & INCOMING CALL RINGING
  ========================================================== */
  function initWebRTC() {
    peer = new Peer(family[currentUserId].id, {
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      }
    });

    peer.on("open", () => {
      Object.keys(family).forEach(k => {
        if (k !== currentUserId) connectToPeer(k);
      });
    });

    peer.on("connection", bindConnection);

    // Incoming Call Hook
    peer.on("call", (incoming) => {
      incomingCallObject = incoming;
      const callerKey = Object.keys(family).find(k => family[k].id === incoming.peer);
      const callerName = callerKey ? family[callerKey].name : "Family Member";
      const isVideo = incoming.metadata?.video !== false;

      document.getElementById("ringAvatar").textContent = callerName[0];
      document.getElementById("ringCallerName").textContent = callerName;
      document.getElementById("ringCallType").textContent = `Incoming ${isVideo ? "Video" : "Voice"} Call...`;
      document.getElementById("incomingCallModal").style.display = "flex";

      startRingingSound();
    });
  }

  function connectToPeer(targetKey) {
    if (activeConnections[targetKey]?.open) return;
    const conn = peer.connect(family[targetKey].id, { reliable: true });
    bindConnection(conn);
  }

  function bindConnection(conn) {
    conn.on("open", () => {
      const partner = Object.keys(family).find(k => family[k].id === conn.peer);
      if (partner) {
        activeConnections[partner] = conn;
        onlinePeers.add(partner);
        renderContacts(document.getElementById("searchBar").value);
        if (activeRecipientKey === partner) emitReceipt(partner, null, "read");
      }
    });

    conn.on("data", (packet) => handleIncomingData(packet, conn.peer));

    conn.on("close", () => {
      const partner = Object.keys(family).find(k => family[k].id === conn.peer);
      if (partner) {
        delete activeConnections[partner];
        onlinePeers.delete(partner);
        renderContacts(document.getElementById("searchBar").value);
      }
    });
  }

  /* ==========================================================
     7. CALL ACCEPT / REJECT / ACTIVE SESSION
  ========================================================== */
  async function acceptIncomingCall() {
    stopRingingSound();
    document.getElementById("incomingCallModal").style.display = "none";
    if (!incomingCallObject) return;

    const isVideo = incomingCallObject.metadata?.video !== false;
    if (!persistentLocalStream) await requestPersistentMediaPermissions();

    persistentLocalStream.getVideoTracks().forEach(t => t.enabled = isVideo);
    persistentLocalStream.getAudioTracks().forEach(t => t.enabled = true);

    document.getElementById("localVideo").srcObject = persistentLocalStream;
    document.getElementById("callOverlay").style.display = "flex";

    incomingCallObject.answer(persistentLocalStream);
    activeCallSession = incomingCallObject;

    incomingCallObject.on("stream", (rem) => {
      document.getElementById("remoteVideo").srcObject = rem;
    });
    incomingCallObject.on("close", terminateCall);
  }

  function rejectIncomingCall() {
    stopRingingSound();
    document.getElementById("incomingCallModal").style.display = "none";
    if (incomingCallObject) {
      incomingCallObject.close();
      incomingCallObject = null;
    }
  }

  async function triggerCall(isVideo) {
    if (!activeRecipientKey) return;
    if (!persistentLocalStream) await requestPersistentMediaPermissions();

    persistentLocalStream.getVideoTracks().forEach(t => t.enabled = isVideo);
    persistentLocalStream.getAudioTracks().forEach(t => t.enabled = true);

    document.getElementById("localVideo").srcObject = persistentLocalStream;
    document.getElementById("callOverlay").style.display = "flex";

    const call = peer.call(family[activeRecipientKey].id, persistentLocalStream, { metadata: { video: isVideo } });
    activeCallSession = call;

    call.on("stream", (rem) => {
      document.getElementById("remoteVideo").srcObject = rem;
    });
    call.on("close", terminateCall);
  }

  function toggleAudio() {
    if (persistentLocalStream) {
      const track = persistentLocalStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("muteMicBtn").textContent = track.enabled ? "🎤" : "🔇";
      }
    }
  }

  function toggleVideo() {
    if (persistentLocalStream) {
      const track = persistentLocalStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        document.getElementById("muteCamBtn").textContent = track.enabled ? "📹" : "🚫";
      }
    }
  }

  function terminateCall() {
    stopRingingSound();
    document.getElementById("incomingCallModal").style.display = "none";
    document.getElementById("callOverlay").style.display = "none";

    if (activeCallSession) {
      activeCallSession.close();
      activeCallSession = null;
    }
    if (persistentLocalStream) {
      // Keep tracks authorized, just disable hardware streaming
      persistentLocalStream.getVideoTracks().forEach(t => t.enabled = false);
      persistentLocalStream.getAudioTracks().forEach(t => t.enabled = false);
    }
    document.getElementById("remoteVideo").srcObject = null;
    document.getElementById("localVideo").srcObject = null;
  }

  /* ==========================================================
     8. CHUNKED MEDIA WITH DYNAMIC PROGRESS BARS
  ========================================================== */
  function toggleAttachmentMenu() {
    const m = document.getElementById("attachmentMenu");
    m.style.display = m.style.display === "flex" ? "none" : "flex";
  }

  function dispatchFile(event) {
    toggleAttachmentMenu();
    const file = event.target.files[0];
    if (!file || !activeRecipientKey) return;

    const fileId = "file-" + Date.now();
    const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    const isConn = activeConnections[activeRecipientKey]?.open;

    // Create Sender Initial Bubble with Progress
    const placeholder = {
      id: fileId,
      fileName: file.name,
      fileType: file.type,
      fileSize: file.size,
      time: getCurrentTime(),
      direction: "sent"
    };
    renderProgressBubble(placeholder, "Uploading...");

    const reader = new FileReader();
    let offset = 0;
    let chunkIndex = 0;
    let fullBase64Data = "";

    // Read full for local preview & offline cache
    const previewReader = new FileReader();
    previewReader.onload = (ev) => {
      fullBase64Data = ev.target.result;
    };
    previewReader.readAsDataURL(file);

    reader.onload = (e) => {
      if (isConn) {
        activeConnections[activeRecipientKey].send({
          type: "file-chunk",
          fileId,
          fileName: file.name,
          fileType: file.type,
          fileSize: file.size,
          chunkIndex,
          totalChunks,
          chunkData: e.target.result,
          time: placeholder.time
        });
      }

      offset += e.target.result.byteLength;
      chunkIndex++;
      const percent = Math.round((chunkIndex / totalChunks) * 100);
      updateProgressBar(fileId, percent, `Uploading... ${percent}%`);

      if (offset < file.size) {
        readSlice(offset);
      } else {
        // Complete Sender
        setTimeout(() => {
          removeProgressBar(fileId);
          const packet = {
            type: "media",
            id: fileId,
            fileName: file.name,
            fileType: file.type,
            fileSize: file.size,
            data: fullBase64Data,
            time: placeholder.time
          };
          saveMessageLocally({ ...packet, chatWith: activeRecipientKey, direction: "sent", status: isConn ? "sent" : "queued" });
          renderMediaBubble(packet, "sent", isConn ? "sent" : "queued", true, fileId);
        }, 300);
      }
    };

    function readSlice(o) {
      reader.readAsArrayBuffer(file.slice(o, o + CHUNK_SIZE));
    }
    readSlice(0);
    event.target.value = "";
  }

  function handleIncomingData(packet, peerId) {
    const sender = Object.keys(family).find(k => family[k].id === peerId);
    if (!sender) return;

    if (packet.type === "receipt") {
      updateTickUI(packet.msgId, packet.status);
      updateMessageStatusLocally(packet.msgId, packet.status);
      return;
    }

    if (packet.type === "chat") {
      emitReceipt(sender, packet.id, "delivered");
      if (activeRecipientKey === sender) emitReceipt(sender, packet.id, "read");

      saveMessageLocally({ ...packet, chatWith: sender, direction: "received", status: activeRecipientKey === sender ? "read" : "delivered" });
      if (activeRecipientKey === sender) renderChatBubble(packet, "received", "delivered", true);
    }

    // Chunk Receiver with Realtime Progress
    if (packet.type === "file-chunk") {
      if (!incomingTransfers[packet.fileId]) {
        incomingTransfers[packet.fileId] = {
          chunks: [],
          received: 0,
          total: packet.totalChunks,
          meta: packet
        };
        // Render receiving progress bar
        if (activeRecipientKey === sender) {
          renderProgressBubble({ ...packet, id: packet.fileId, direction: "received" }, "Downloading...");
        }
      }

      const item = incomingTransfers[packet.fileId];
      item.chunks[packet.chunkIndex] = packet.chunkData;
      item.received++;

      const percent = Math.round((item.received / item.total) * 100);
      updateProgressBar(packet.fileId, percent, `Downloading... ${percent}%`);

      if (item.received === item.total) {
        // Assemble Binary to Base64
        const blob = new Blob(item.chunks, { type: packet.fileType });
        const reader = new FileReader();
        reader.onloadend = () => {
          const finalData = reader.result;
          removeProgressBar(packet.fileId);

          const finalPacket = {
            type: "media",
            id: packet.fileId,
            fileName: packet.fileName,
            fileType: packet.fileType,
            fileSize: packet.fileSize,
            data: finalData,
            time: packet.time
          };

          emitReceipt(sender, packet.fileId, "delivered");
          if (activeRecipientKey === sender) emitReceipt(sender, packet.fileId, "read");

          saveMessageLocally({ ...finalPacket, chatWith: sender, direction: "received", status: activeRecipientKey === sender ? "read" : "delivered" });
          if (activeRecipientKey === sender) renderMediaBubble(finalPacket, "received", "delivered", true, packet.fileId);
          delete incomingTransfers[packet.fileId];
        };
        reader.readAsDataURL(blob);
      }
    }
  }

  /* Progress UI Helpers */
  function renderProgressBubble(data, label) {
    const box = document.getElementById("messagesContainer");
    const div = document.createElement("div");
    div.className = `message ${data.direction}`;
    div.id = `msg-${data.id}`;
    div.innerHTML = `
      <div style="font-weight: 600; font-size: 13px;">${escapeHTML(data.fileName)}</div>
      <div class="progress-box">
        <div class="progress-label"><span id="lbl-${data.id}">${label}</span><span id="pct-${data.id}">0%</span></div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar-${data.id}"></div></div>
      </div>
      <div class="msg-meta"><span>${data.time || getCurrentTime()}</span></div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function updateProgressBar(id, pct, text) {
    const bar = document.getElementById(`bar-${id}`);
    const pctEl = document.getElementById(`pct-${id}`);
    const lbl = document.getElementById(`lbl-${id}`);
    if (bar) bar.style.width = pct + "%";
    if (pctEl) pctEl.textContent = pct + "%";
    if (lbl && text) lbl.textContent = text;
  }

  function removeProgressBar(id) {
    const el = document.getElementById(`msg-${id}`);
    if (el) el.remove();
  }

  /* ==========================================================
     9. UI RENDERING: CHAT BUBBLES, LIGHTBOX & RECEIPTS
  ========================================================== */
  function openChat(targetKey) {
    activeRecipientKey = targetKey;
    document.getElementById("chatTitle").textContent = family[targetKey].name;
    document.getElementById("chatAvatar").textContent = family[targetKey].name[0];
    document.getElementById("chatView").classList.add("active");

    connectToPeer(targetKey);
    renderContacts(document.getElementById("searchBar").value);
    loadChatHistory(targetKey);
    emitReceipt(targetKey, null, "read");
  }

  function closeChat() {
    document.getElementById("chatView").classList.remove("active");
    activeRecipientKey = null;
  }

  function sendText() {
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text || !activeRecipientKey) return;

    const msgId = "msg-" + Date.now();
    const isConn = activeConnections[activeRecipientKey]?.open;
    const initialStatus = isConn ? "sent" : "queued";

    const packet = {
      type: "chat",
      id: msgId,
      text,
      from: currentUserId,
      to: activeRecipientKey,
      time: getCurrentTime()
    };

    saveMessageLocally({ ...packet, chatWith: activeRecipientKey, direction: "sent", status: initialStatus });
    renderChatBubble(packet, "sent", initialStatus, true);

    if (isConn) activeConnections[activeRecipientKey].send(packet);
    input.value = "";
  }

  function renderChatBubble(data, direction, status = "delivered", scroll = true) {
    const box = document.getElementById("messagesContainer");
    const msg = document.createElement("div");
    msg.className = `message ${direction}`;
    msg.id = `msg-${data.id}`;

    const tick = direction === "sent"
      ? `<span class="tick ${status}" id="tick-${data.id}">${status === "queued" ? "🕒" : status === "read" ? "✓✓" : "✓"}</span>`
      : "";

    msg.innerHTML = `
      <div>${escapeHTML(data.text)}</div>
      <div class="msg-meta"><span>${data.time || getCurrentTime()}</span>${tick}</div>
    `;
    box.appendChild(msg);
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  function renderMediaBubble(data, direction, status = "delivered", scroll = true, replaceId = null) {
    const box = document.getElementById("messagesContainer");
    let msg = replaceId ? document.getElementById(`msg-${replaceId}`) : null;
    if (!msg) {
      msg = document.createElement("div");
      msg.id = `msg-${data.id}`;
      box.appendChild(msg);
    }
    msg.className = `message ${direction}`;

    const tick = direction === "sent"
      ? `<span class="tick ${status}" id="tick-${data.id}">${status === "queued" ? "🕒" : status === "read" ? "✓✓" : "✓"}</span>`
      : "";

    let content = "";
    const type = data.fileType || "";

    if (type.startsWith("image/")) {
      content = `<div class="media-thumb-box" onclick="openLightbox('${data.data}', '${escapeHTML(data.fileName)}', 'image')"><img src="${data.data}" /></div>`;
    } else if (type.startsWith("video/")) {
      content = `<div class="media-thumb-box" onclick="openLightbox('${data.data}', '${escapeHTML(data.fileName)}', 'video')"><video src="${data.data}"></video></div>`;
    } else if (type.startsWith("audio/")) {
      content = `<audio src="${data.data}" controls style="width: 100%; margin: 4px 0;"></audio>`;
    } else {
      content = `
        <div class="doc-bubble" onclick="openLightbox('${data.data}', '${escapeHTML(data.fileName)}', 'doc')">
          <span style="font-size: 26px;">📄</span>
          <div style="overflow: hidden;">
            <div style="font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">${escapeHTML(data.fileName)}</div>
            <small style="color: var(--wa-text-secondary);">${formatBytes(data.fileSize)} • Tap to view</small>
          </div>
        </div>`;
    }

    msg.innerHTML = `${content}<div class="msg-meta"><span>${data.time || getCurrentTime()}</span>${tick}</div>`;
    if (scroll) box.scrollTop = box.scrollHeight;
  }

  function emitReceipt(target, msgId, status) {
    if (activeConnections[target]?.open) {
      activeConnections[target].send({ type: "receipt", msgId, status });
    }
  }

  function updateTickUI(msgId, status) {
    if (!msgId) {
      document.querySelectorAll(".tick.sent, .tick.delivered").forEach(el => {
        el.className = "tick read";
        el.textContent = "✓✓";
      });
      return;
    }
    const tick = document.getElementById(`tick-${msgId}`);
    if (tick) {
      tick.className = `tick ${status}`;
      tick.textContent = "✓✓";
    }
  }

  function openLightbox(url, name, kind) {
    const box = document.getElementById("mediaLightbox");
    const body = document.getElementById("lightboxBody");
    document.getElementById("lightboxTitle").textContent = name;
    document.getElementById("lightboxDownloadBtn").onclick = () => {
      const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    };

    body.innerHTML = "";
    if (kind === "image") body.innerHTML = `<img src="${url}" />`;
    else if (kind === "video") body.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
    else body.innerHTML = `<iframe src="${url}"></iframe>`;
    box.style.display = "flex";
  }

  function closeLightbox() {
    document.getElementById("mediaLightbox").style.display = "none";
  }

  /* ==========================================================
     10. HELPERS & STARTUP
  ========================================================== */
  function getCurrentTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 B";
    const k = 1024;
    const sizes = ["B", "KB", "MB", "GB"];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
  }

  function escapeHTML(str) {
    return (str || "").replace(/[&<>'"]/g, t => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[t] || t));
  }

  window.addEventListener("DOMContentLoaded", async () => {
    await initLocalDB();
    await syncMembersFromGoogleSheet();

    const storedUser = localStorage.getItem("wa_active_user");
    if (storedUser && family[storedUser]) {
      completeLogin(storedUser);
    } else {
      document.getElementById("authModal").style.display = "flex";
    }
  });
</script>
